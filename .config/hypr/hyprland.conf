bind = SUPER, R, exec, wofi --show drun

# Window rules for Flameshot (needed for correct rendering under Wayland/Hyprland)
windowrulev2 = float, class:^(flameshot)$
windowrulev2 = move 0 0, class:^(flameshot)$
windowrulev2 = pin, class:^(flameshot)$
windowrulev2 = fullscreenstate 2 2, class:^(flameshot)$
windowrulev2 = monitor 0, class:^(flameshot)$

# Keybind for flameshot
bind = , Print, exec, XDG_CURRENT_DESKTOP=sway flameshot gui


