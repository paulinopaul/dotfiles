# ==============================================================================
# Cocoa Desktop Shell - Hyprlock Minimalist Screen Blur & Media
# ==============================================================================

$font = JetBrainsMono Nerd Font

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# Cinemática lenta y cinematográfica de desvanecimiento y aclarado
animations {
    enabled = true
    bezier = cinematic, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 8, cinematic
    animation = fadeOut, 1, 9, cinematic
    animation = inputFieldDots, 1, 2, cinematic
}

# Captura en tiempo real del escritorio con desenfoque multicapa en GPU
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.80
    vibrancy = 0.20
    color = rgba(18, 18, 24, 1.0)
}

# Campo de contraseña reactivo: oculto en reposo (fade_on_empty) hasta pulsar teclas
input-field {
    monitor =
    size = 240, 48
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(127, 153, 204, 0.70)
    inner_color = rgba(25, 27, 36, 0.65)
    font_color = rgb(240, 240, 245)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##a0a8b8">PIN / Contraseña...</span>
    hide_input = false
    rounding = 12
    position = 0, -80
    halign = center
    valign = center
}

# Reloj digital central minimalista
label {
    monitor =
    text = $TIME
    color = rgba(245, 245, 250, 0.95)
    font_size = 72
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

# Fecha localizada en español
label {
    monitor =
    text = cmd[update:60000] LC_TIME="es_ES.UTF-8" date +"%A, %d de %B de %Y"
    color = rgba(180, 190, 210, 0.75)
    font_size = 18
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}

# Mini-reproductor condicional exclusivo de Spotify (solo visible al reproducir)
label {
    monitor =
    text = cmd[update:1000] python3 /home/paul/.config/quickshell/cocoa/scripts/hyprlock_spotify.py
    color = rgba(240, 240, 245, 0.90)
    font_size = 13
    font_family = $font
    position = 0, -145
    halign = center
    valign = center
}
