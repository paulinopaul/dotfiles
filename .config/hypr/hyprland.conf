# --- Variables de Entorno & Aplicaciones por Defecto ---
$terminal = ghostty
env = TERMINAL,ghostty

# --- Monitor ---
monitor=eDP-1,1920x1080@144,0x0,1

# --- Autostart ---
# exec-once = swaync (deshabilitado en favor del sistema integrado de notificaciones de Cocoa)
# start_shell.sh gestiona hyprpaper + quickshell cocoa con espera de monitor
exec-once = ~/.config/hypr/scripts/start_shell.sh

# --- Window Rules & Layer Rules ---
# Layer rules para Cocoa Desktop Shell
layerrule = blur 1, match:namespace = ^(cocoa-notifications)$
layerrule = ignore_alpha 0.5, match:namespace = ^(cocoa-notifications)$
layerrule = blur 1, match:namespace = ^(cocoa-settings)$
layerrule = ignore_alpha 0.5, match:namespace = ^(cocoa-settings)$

# Window rules for Flameshot (needed for correct rendering under Wayland/Hyprland)
windowrule = float 1, match:class = ^(flameshot)$
windowrule = move 0 0, match:class = ^(flameshot)$
windowrule = pin 1, match:class = ^(flameshot)$
windowrule = monitor 0, match:class = ^(flameshot)$

# --- Keybindings ---
# Keybind for flameshot
bind = , Print, exec, XDG_CURRENT_DESKTOP=sway flameshot gui

# Aplicaciones principales
bind = SUPER, Q, exec, $terminal
bind = SUPER, C, killactive
bind = SUPER, E, exec, dolphin

# Lanzador de Aplicaciones (Cocoa Shell integrado)
bind = SUPER, R, global, quickshell:launcher

# Selector de Fondos de Pantalla (Cocoa Shell integrado: Super + Space)
bind = SUPER, space, global, quickshell:wallpaper_selector

# Panel Central Desacoplado (Cocoa Shell integrado: Super + P)
bind = SUPER, P, global, quickshell:center_panel

# Menú de Configuración de Cocoa (Super + I)
bind = SUPER, I, global, quickshell:settings_dialog


# Navegación de escritorios
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Movimiento de ventanas a escritorios
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# --- Input ---
input {
    kb_layout = latam
}

# --- Tema y Colores Dinámicos (Wallpaper) ---
source = ~/.config/hypr/theme.conf

# --- General (Bordes y Disposición) ---
general {
    border_size = 2
    gaps_in = 5
    gaps_out = 15
}

# --- Decoración y Apariencia ---
decoration {
    rounding = 14

    # Sombra ligera
    shadow {
        enabled = true
        range = 15
        render_power = 6
        color = rgba(00000044)
        color_inactive = rgba(00000020)
    }
}

# --- Movimiento y Tamaño de Ventanas ---
# Navegación de foco entre ventanas
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Mover ventanas activas en el mosaico
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Redimensionar ventanas (usamos binde para que se repita al mantener presionado)
binde = SUPER, plus, resizeactive, 30 0
binde = SUPER, minus, resizeactive, -30 0
# Por si acaso el teclado requiere shift para el signo +
binde = SUPER SHIFT, plus, resizeactive, 30 0
binde = SUPER SHIFT, minus, resizeactive, -30 0

# --- Espacios de Trabajo Temáticos ---
# Navegar
bind = SUPER, M, exec, ~/.config/hypr/scripts/workspace_app.sh Music spotify
bind = SUPER, D, exec, ~/.config/hypr/scripts/workspace_app.sh Discord discord

# Reglas automáticas para enviar apps a sus escritorios respectivos
windowrule = workspace name:Music, match:class = (?i)^(spotify)$
windowrule = workspace name:Discord, match:class = (?i)^(discord|webcord|vesktop|telegramdesktop)$

# --- Capturas de Pantalla y Video ---
# Super+Shift+S para recorte al portapapeles (estilo Windows)
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Para grabación de pantalla (Video):
# bind = SUPER SHIFT, R, exec, wf-recorder -f ~/Videos/grabacion_$(date +'%Y-%m-%d_%H-%M-%S').mp4
# bind = SUPER SHIFT, T, exec, killall wf-recorder # Para detener la grabación

# --- Misceláneos ---
misc {
    # Redirigir automáticamente (cambiar de escritorio) cuando una aplicación se abre en otro lado
    focus_on_activate = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# --- Teclas Multimedia (Asus Laptop) ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- Brillo de Pantalla (fn+f7 / fn+f8) ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# --- Pantalla de Bloqueo (fn+f11) ---
bind = , XF86Sleep, exec, hyprlock
# Atajo alternativo por si fn+f11 no envía un XF86:
bind = SUPER, F11, exec, hyprlock

# --- Captura de Pantalla (fn+f6) ---
# Algunas Asus envían un XF86 específico (ej. F6 suele ser Touchpad, Display o Snipping Tool)
bind = , XF86Launch4, exec, grim -g "$(slurp)" - | wl-copy
bind = , XF86SelectiveScreenshot, exec, grim -g "$(slurp)" - | wl-copy
# Atajo alternativo:
bind = SUPER, F6, exec, grim -g "$(slurp)" - | wl-copy

# Demonio de telemetría para Cocoa Shell
exec-once = ~/.config/quickshell/cocoa/scripts/cocoa_daemon.sh
